name: Images

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "build.sh"
      - ".github/workflows/images.yml"
      - ".github/actions/publish-image/action.yml"
  pull_request:
    branches: [main]
    paths:
      - "image/**"
      - "build.sh"
      - ".github/workflows/images.yml"
      - ".github/actions/publish-image/action.yml"
  schedule:
    - cron: "30 6 * * 1"
    - cron: "30 6 * * *"
    - cron: "30 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || 'none' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: mihneateodorstoica
  DEFAULT_PYTHON_VERSION: "3.13"
  IMAGE_DESCRIPTION_MINIMAL: JovyKit minimal Jupyter image with Python, uv, JupyterLab add-ons, and Nitro CLI.
  IMAGE_DESCRIPTION_BASE: JovyKit base Jupyter image for everyday data science, classical machine learning, statistics, and local data access.
  IMAGE_DESCRIPTION_EXTENDED: JovyKit extended Jupyter image for advanced machine learning, NLP, time series, distributed compute, and API work.
  IMAGE_DESCRIPTION_FULL: JovyKit full Jupyter image with heavier AI, graph, geospatial, database, and research tooling.

jobs:
  define-images:
    name: define image order
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Define image matrix
        id: matrix
        run: |
          {
            echo "matrix<<JSON"
          cat <<'JSON'
          {"include":[{"target":"minimal","python-version":"3.9"},{"target":"base","python-version":"3.9"},{"target":"minimal","python-version":"3.10"},{"target":"base","python-version":"3.10"},{"target":"minimal","python-version":"3.11"},{"target":"base","python-version":"3.11"},{"target":"extended","python-version":"3.11"},{"target":"full","python-version":"3.11"},{"target":"minimal","python-version":"3.12"},{"target":"base","python-version":"3.12"},{"target":"extended","python-version":"3.12"},{"target":"full","python-version":"3.12"},{"target":"minimal","python-version":"3.13"},{"target":"base","python-version":"3.13"},{"target":"extended","python-version":"3.13"},{"target":"full","python-version":"3.13"},{"target":"minimal","python-version":"3.14"},{"target":"base","python-version":"3.14"}]}
          JSON
            echo "JSON"
          } >> "$GITHUB_OUTPUT"

  build-images:
    name: build ${{ matrix.target }} py${{ matrix.python-version }}
    needs: define-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.define-images.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Plan image build
        id: plan
        run: |
          should_build=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
            case "${{ matrix.target }}" in
              minimal|base) should_build=true ;;
              *) should_build=false ;;
            esac
          fi

          case "${{ matrix.target }}" in
            minimal)
              description="$IMAGE_DESCRIPTION_MINIMAL"
              parent_target=""
              ;;
            base)
              description="$IMAGE_DESCRIPTION_BASE"
              parent_target="minimal"
              ;;
            extended)
              description="$IMAGE_DESCRIPTION_EXTENDED"
              parent_target="base"
              ;;
            full)
              description="$IMAGE_DESCRIPTION_FULL"
              parent_target="extended"
              ;;
          esac

          image_name="jovykit"
          cache_scope="${{ matrix.target }}-${{ matrix.python-version }}"

          {
            echo "IMAGE_NAME=$image_name"
            echo "IMAGE_DESCRIPTION=$description"
            echo "CACHE_SCOPE=$cache_scope"
          } >> "$GITHUB_ENV"

          {
            echo "should-build=$should_build"
            echo "cache-from<<EOF"
            echo "type=gha,scope=$cache_scope"
            if [ -n "$parent_target" ]; then
              echo "type=gha,scope=${parent_target}-${{ matrix.python-version }}"
            fi
            echo "EOF"
            echo "cache-to<<EOF"
            echo "type=gha,mode=max,scope=$cache_scope"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.plan.outputs.should-build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image cache
        if: steps.plan.outputs.should-build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./image
          file: ./image/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          push: false
          provenance: false
          sbom: false
          cache-from: ${{ github.event_name != 'pull_request' && steps.plan.outputs.cache-from || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && steps.plan.outputs.cache-to || '' }}

  publish-python-3-9:
    name: publish ${{ matrix.target }} py${{ matrix.python-version }}
    needs: build-images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [minimal, base]
        python-version: ["3.9"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish image
        uses: ./.github/actions/publish-image
        with:
          target: ${{ matrix.target }}
          python-version: ${{ matrix.python-version }}

  publish-python-3-10:
    name: publish ${{ matrix.target }} py${{ matrix.python-version }}
    needs:
      - build-images
      - publish-python-3-9
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [minimal, base]
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish image
        uses: ./.github/actions/publish-image
        with:
          target: ${{ matrix.target }}
          python-version: ${{ matrix.python-version }}

  publish-python-3-11:
    name: publish ${{ matrix.target }} py${{ matrix.python-version }}
    needs:
      - build-images
      - publish-python-3-10
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [minimal, base, extended, full]
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish image
        uses: ./.github/actions/publish-image
        with:
          target: ${{ matrix.target }}
          python-version: ${{ matrix.python-version }}

  publish-python-3-12:
    name: publish ${{ matrix.target }} py${{ matrix.python-version }}
    needs:
      - build-images
      - publish-python-3-11
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [minimal, base, extended, full]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish image
        uses: ./.github/actions/publish-image
        with:
          target: ${{ matrix.target }}
          python-version: ${{ matrix.python-version }}

  publish-python-3-13:
    name: publish ${{ matrix.target }} py${{ matrix.python-version }}
    needs:
      - build-images
      - publish-python-3-12
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [minimal, base, extended, full]
        python-version: ["3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish image
        uses: ./.github/actions/publish-image
        with:
          target: ${{ matrix.target }}
          python-version: ${{ matrix.python-version }}

  publish-python-3-14:
    name: publish ${{ matrix.target }} py${{ matrix.python-version }}
    needs:
      - build-images
      - publish-python-3-13
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [minimal, base]
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish image
        uses: ./.github/actions/publish-image
        with:
          target: ${{ matrix.target }}
          python-version: ${{ matrix.python-version }}

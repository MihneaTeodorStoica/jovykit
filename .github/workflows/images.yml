name: Images

on:
  push:
    branches: [main]
    paths:
      - "image/**"
  pull_request:
    branches: [main]
    paths:
      - "image/**"
  schedule:
    - cron: "30 6 * * 1"
    - cron: "30 6 * * *"
    - cron: "30 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || 'none' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: mihneateodorstoica

jobs:
  images:
    name: Images / ${{ matrix.type }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - type: minimal
            target: minimal
          - type: base
            target: base
          - type: extended
            target: extended
          - type: full
            target: full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/jovykit-${{ matrix.type }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * *' }}
            type=raw,value=weekly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1' }}
            type=raw,value=monthly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 1 * *' }}

      - name: Build and publish ${{ matrix.type }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./image
          file: ./image/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.type }}
          cache-to: type=gha,mode=max,scope=${{ matrix.type }}

      - name: Attest image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/jovykit-${{ matrix.type }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

name: Images

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "build.sh"
      - ".github/workflows/images.yml"
      - ".github/actions/publish-image/action.yml"
  pull_request:
    branches: [main]
    paths:
      - "image/**"
      - "build.sh"
      - ".github/workflows/images.yml"
      - ".github/actions/publish-image/action.yml"
  schedule:
    - cron: "30 6 * * 1"
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || 'none' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: mihneateodorstoica
  DEFAULT_PYTHON_VERSION: "3.12"
  IMAGE_DESCRIPTION_MINIMAL: JovyKit minimal Jupyter image with Python, uv, JupyterLab add-ons, and Nitro CLI.
  IMAGE_DESCRIPTION_BASE: JovyKit base Jupyter image for everyday data science, classical machine learning, statistics, and local data access.
  IMAGE_DESCRIPTION_EXTENDED: JovyKit extended Jupyter image for advanced machine learning, NLP, time series, distributed compute, and API work.
  IMAGE_DESCRIPTION_FULL: JovyKit full Jupyter image with heavier AI, graph, geospatial, database, and research tooling.

jobs:
  define-images:
    name: define image order
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Define image matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            matrix='{"include":[{"target":"full","python-version":"3.12"}]}'
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "30 6 * * *" ]; then
            matrix='{"include":[{"target":"minimal","python-version":"3.12"},{"target":"base","python-version":"3.12"}]}'
          else
            matrix='{"include":[{"target":"minimal","python-version":"3.9"},{"target":"base","python-version":"3.9"},{"target":"minimal","python-version":"3.10"},{"target":"base","python-version":"3.10"},{"target":"minimal","python-version":"3.11"},{"target":"base","python-version":"3.11"},{"target":"extended","python-version":"3.11"},{"target":"full","python-version":"3.11"},{"target":"minimal","python-version":"3.12"},{"target":"base","python-version":"3.12"},{"target":"extended","python-version":"3.12"},{"target":"full","python-version":"3.12"},{"target":"minimal","python-version":"3.13"},{"target":"base","python-version":"3.13"},{"target":"extended","python-version":"3.13"},{"target":"full","python-version":"3.13"},{"target":"minimal","python-version":"3.14"},{"target":"base","python-version":"3.14"}]}'
          fi

          {
            echo "matrix<<JSON"
            echo "$matrix"
            echo "JSON"
          } >> "$GITHUB_OUTPUT"

  images:
    name: image ${{ matrix.target }} py${{ matrix.python-version }}
    needs: define-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.define-images.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Build image
        uses: ./.github/actions/publish-image
        with:
          target: ${{ matrix.target }}
          python-version: ${{ matrix.python-version }}
          push: ${{ github.event_name != 'pull_request' }}

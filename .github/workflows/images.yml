name: Images

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "build.sh"
      - ".github/workflows/images.yml"
  pull_request:
    branches: [main]
    paths:
      - "image/**"
      - "build.sh"
      - ".github/workflows/images.yml"
  schedule:
    - cron: "30 6 * * 1"
    - cron: "30 6 * * *"
    - cron: "30 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || 'none' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: mihneateodorstoica
  DEFAULT_PYTHON_VERSION: "3.13"
  IMAGE_DESCRIPTION_MINIMAL: JovyKit minimal Jupyter image with Python, uv, JupyterLab add-ons, and Nitro CLI.
  IMAGE_DESCRIPTION_BASE: JovyKit base Jupyter image for everyday data science, classical machine learning, statistics, and local data access.
  IMAGE_DESCRIPTION_EXTENDED: JovyKit extended Jupyter image for advanced machine learning, NLP, time series, distributed compute, and API work.
  IMAGE_DESCRIPTION_FULL: JovyKit full Jupyter image with heavier AI, graph, geospatial, database, and research tooling.

jobs:
  images:
    name: ${{ matrix.target }} py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: minimal
            python-version: "3.9"
          - target: minimal
            python-version: "3.10"
          - target: minimal
            python-version: "3.11"
          - target: minimal
            python-version: "3.12"
          - target: minimal
            python-version: "3.13"
          - target: minimal
            python-version: "3.14"
          - target: base
            python-version: "3.9"
          - target: base
            python-version: "3.10"
          - target: base
            python-version: "3.11"
          - target: base
            python-version: "3.12"
          - target: base
            python-version: "3.13"
          - target: base
            python-version: "3.14"
          - target: extended
            python-version: "3.11"
          - target: extended
            python-version: "3.12"
          - target: extended
            python-version: "3.13"
          - target: full
            python-version: "3.11"
          - target: full
            python-version: "3.12"
          - target: full
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Plan image build
        id: plan
        run: |
          should_build=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
            case "${{ matrix.target }}" in
              minimal|base) should_build=true ;;
              *) should_build=false ;;
            esac
          fi

          case "${{ matrix.target }}" in
            minimal)
              description="$IMAGE_DESCRIPTION_MINIMAL"
              parent_target=""
              ;;
            base)
              description="$IMAGE_DESCRIPTION_BASE"
              parent_target="minimal"
              ;;
            extended)
              description="$IMAGE_DESCRIPTION_EXTENDED"
              parent_target="base"
              ;;
            full)
              description="$IMAGE_DESCRIPTION_FULL"
              parent_target="extended"
              ;;
          esac

          image_name="jovykit"
          cache_scope="${{ matrix.target }}-${{ matrix.python-version }}"

          {
            echo "IMAGE_NAME=$image_name"
            echo "IMAGE_DESCRIPTION=$description"
            echo "CACHE_SCOPE=$cache_scope"
          } >> "$GITHUB_ENV"

          {
            echo "should-build=$should_build"
            echo "cache-from<<EOF"
            echo "type=gha,scope=$cache_scope"
            if [ -n "$parent_target" ]; then
              echo "type=gha,scope=${parent_target}-${{ matrix.python-version }}"
            fi
            echo "EOF"
            echo "cache-to<<EOF"
            echo "type=gha,mode=max,scope=$cache_scope"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.plan.outputs.should-build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.plan.outputs.should-build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.plan.outputs.should-build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.target }}-python-${{ matrix.python-version }}
            type=raw,value=latest,enable=${{ matrix.target == 'minimal' && matrix.python-version == '3.14' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
            type=raw,value=${{ matrix.target }}-python-${{ matrix.python-version }}-${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ matrix.target }}-nightly-python-${{ matrix.python-version }},enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * *' }}
            type=raw,value=${{ matrix.target }}-weekly-python-${{ matrix.python-version }},enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1' }}
            type=raw,value=${{ matrix.target }}-monthly-python-${{ matrix.python-version }},enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 1 * *' }}
          labels: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          annotations: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest

      - name: Build and publish image
        if: steps.plan.outputs.should-build == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./image
          file: ./image/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ github.event_name != 'pull_request' && steps.meta.outputs.annotations || '' }}
          provenance: false
          sbom: false
          cache-from: ${{ github.event_name != 'pull_request' && steps.plan.outputs.cache-from || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && steps.plan.outputs.cache-to || '' }}

      - name: Attest image provenance
        if: steps.plan.outputs.should-build == 'true' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false
          create-storage-record: false

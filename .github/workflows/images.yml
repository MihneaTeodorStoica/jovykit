name: Images

on:
  push:
    branches: [main]
    paths:
      - "image/**"
  pull_request:
    branches: [main]
    paths:
      - "image/**"
  schedule:
    - cron: "30 6 * * 1"
    - cron: "30 6 * * *"
    - cron: "30 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || 'none' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: mihneateodorstoica
  CI_IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  images:
    name: Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract minimal metadata
        id: meta_minimal
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/jovykit-minimal
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * *' }}
            type=raw,value=weekly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1' }}
            type=raw,value=monthly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 1 * *' }}
            type=raw,value=${{ env.CI_IMAGE_TAG }},enable=${{ github.event_name != 'pull_request' }}

      - name: Build and publish minimal
        id: build_minimal
        uses: docker/build-push-action@v7
        with:
          context: ./image
          file: ./image/minimal/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta_minimal.outputs.tags }}
            ${{ github.event_name == 'pull_request' && 'jovykit-minimal:ci' || '' }}
          labels: ${{ steps.meta_minimal.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=minimal
          cache-to: type=gha,mode=max,scope=minimal

      - name: Attest minimal provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/jovykit-minimal
          subject-digest: ${{ steps.build_minimal.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Extract base metadata
        id: meta_base
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/jovykit-base
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * *' }}
            type=raw,value=weekly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1' }}
            type=raw,value=monthly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 1 * *' }}
            type=raw,value=${{ env.CI_IMAGE_TAG }},enable=${{ github.event_name != 'pull_request' }}

      - name: Build and publish base
        id: build_base
        uses: docker/build-push-action@v7
        with:
          context: ./image
          file: ./image/base/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ github.event_name == 'pull_request' && 'jovykit-minimal:ci' || format('{0}/{1}/jovykit-minimal:{2}', env.REGISTRY, env.IMAGE_NAMESPACE, env.CI_IMAGE_TAG) }}
          tags: |
            ${{ steps.meta_base.outputs.tags }}
            ${{ github.event_name == 'pull_request' && 'jovykit-base:ci' || '' }}
          labels: ${{ steps.meta_base.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Attest base provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/jovykit-base
          subject-digest: ${{ steps.build_base.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Extract extended metadata
        id: meta_extended
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/jovykit-extended
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * *' }}
            type=raw,value=weekly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1' }}
            type=raw,value=monthly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 1 * *' }}
            type=raw,value=${{ env.CI_IMAGE_TAG }},enable=${{ github.event_name != 'pull_request' }}

      - name: Build and publish extended
        id: build_extended
        uses: docker/build-push-action@v7
        with:
          context: ./image
          file: ./image/extended/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ github.event_name == 'pull_request' && 'jovykit-base:ci' || format('{0}/{1}/jovykit-base:{2}', env.REGISTRY, env.IMAGE_NAMESPACE, env.CI_IMAGE_TAG) }}
          tags: |
            ${{ steps.meta_extended.outputs.tags }}
            ${{ github.event_name == 'pull_request' && 'jovykit-extended:ci' || '' }}
          labels: ${{ steps.meta_extended.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=extended
          cache-to: type=gha,mode=max,scope=extended

      - name: Attest extended provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/jovykit-extended
          subject-digest: ${{ steps.build_extended.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Extract full metadata
        id: meta_full
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/jovykit-full
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * *' }}
            type=raw,value=weekly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1' }}
            type=raw,value=monthly,enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 1 * *' }}
            type=raw,value=${{ env.CI_IMAGE_TAG }},enable=${{ github.event_name != 'pull_request' }}

      - name: Build and publish full
        id: build_full
        uses: docker/build-push-action@v7
        with:
          context: ./image
          file: ./image/full/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ github.event_name == 'pull_request' && 'jovykit-extended:ci' || format('{0}/{1}/jovykit-extended:{2}', env.REGISTRY, env.IMAGE_NAMESPACE, env.CI_IMAGE_TAG) }}
          tags: |
            ${{ steps.meta_full.outputs.tags }}
            ${{ github.event_name == 'pull_request' && 'jovykit-full:ci' || '' }}
          labels: ${{ steps.meta_full.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full

      - name: Attest full provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/jovykit-full
          subject-digest: ${{ steps.build_full.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

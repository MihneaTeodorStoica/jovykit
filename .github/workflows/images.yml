name: Images

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/images.yml"
  pull_request:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/images.yml"
  schedule:
    - cron: "30 6 * * 1"
    - cron: "30 6 * * *"
    - cron: "30 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || 'none' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: mihneateodorstoica
  DEFAULT_PYTHON_VERSION: "3.13"
  CI_IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
  IMAGE_DESCRIPTION_MINIMAL: JovyKit minimal Jupyter image with JupyterLab add-ons, Nitro CLI, uv, Git, and OpenSSH.
  IMAGE_DESCRIPTION_BASE: JovyKit base Jupyter image for everyday data science, classical machine learning, statistics, and local data access.
  IMAGE_DESCRIPTION_EXTENDED: JovyKit extended Jupyter image for advanced machine learning, NLP, time series, distributed compute, and API work.
  IMAGE_DESCRIPTION_FULL: JovyKit full Jupyter image with heavier AI, graph, geospatial, big-data, database, and research tooling.

jobs:
  images:
    name: ${{ matrix.target }} py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: minimal
            python-version: "3.9"
          - target: minimal
            python-version: "3.10"
          - target: minimal
            python-version: "3.11"
          - target: minimal
            python-version: "3.12"
          - target: minimal
            python-version: "3.13"
          - target: minimal
            python-version: "3.14"
          - target: base
            python-version: "3.9"
          - target: base
            python-version: "3.10"
          - target: base
            python-version: "3.11"
          - target: base
            python-version: "3.12"
          - target: base
            python-version: "3.13"
          - target: base
            python-version: "3.14"
          - target: extended
            python-version: "3.11"
          - target: extended
            python-version: "3.12"
          - target: extended
            python-version: "3.13"
          - target: full
            python-version: "3.11"
          - target: full
            python-version: "3.12"
          - target: full
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image metadata
        run: |
          case "${{ matrix.target }}" in
            minimal) description="$IMAGE_DESCRIPTION_MINIMAL" ;;
            base) description="$IMAGE_DESCRIPTION_BASE" ;;
            extended) description="$IMAGE_DESCRIPTION_EXTENDED" ;;
            full) description="$IMAGE_DESCRIPTION_FULL" ;;
          esac
          {
            echo "IMAGE_NAME=jovykit-${{ matrix.target }}"
            echo "IMAGE_DESCRIPTION=$description"
            echo "CACHE_SCOPE=${{ matrix.target }}-${{ matrix.python-version }}"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=python-${{ matrix.python-version }}
            type=raw,value=latest,enable=${{ matrix.python-version == env.DEFAULT_PYTHON_VERSION && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
            type=raw,value=nightly-python-${{ matrix.python-version }},enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * *' }}
            type=raw,value=weekly-python-${{ matrix.python-version }},enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1' }}
            type=raw,value=monthly-python-${{ matrix.python-version }},enable=${{ github.event_name == 'schedule' && github.event.schedule == '30 6 1 * *' }}
            type=raw,value=nightly,enable=${{ matrix.python-version == env.DEFAULT_PYTHON_VERSION && github.event_name == 'schedule' && github.event.schedule == '30 6 * * *' }}
            type=raw,value=weekly,enable=${{ matrix.python-version == env.DEFAULT_PYTHON_VERSION && github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1' }}
            type=raw,value=monthly,enable=${{ matrix.python-version == env.DEFAULT_PYTHON_VERSION && github.event_name == 'schedule' && github.event.schedule == '30 6 1 * *' }}
            type=raw,value=${{ env.CI_IMAGE_TAG }}-python-${{ matrix.python-version }},enable=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          annotations: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./image
          file: ./image/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name == 'pull_request' && format('{0}:ci-python-{1}', env.IMAGE_NAME, matrix.python-version) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ github.event_name != 'pull_request' && steps.meta.outputs.annotations || '' }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Attest image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

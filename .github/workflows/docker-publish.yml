name: Publish Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mihneateodorstoica/labkit

jobs:
  build:
    name: Build ${{ matrix.type }} image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - type: minimal
            target: minimal
          - type: base
            target: base
          - type: extended
            target: extended
          - type: full
            target: full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build date
        id: date
        shell: bash
        run: echo "value=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.type }}
        uses: docker/build-push-action@v6
        with:
          context: ./image
          file: ./image/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.type }}-${{ steps.date.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.type }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.date.outputs.value }}
            org.opencontainers.image.title=labkit ${{ matrix.type }}
          cache-from: type=gha,scope=${{ matrix.type }}
          cache-to: type=gha,mode=max,scope=${{ matrix.type }}

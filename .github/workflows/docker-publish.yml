name: Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/docker-publish.yml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: mihneateodorstoica

jobs:
  build:
    name: Build ${{ matrix.type }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - type: minimal
            target: minimal
          - type: base
            target: base
          - type: extended
            target: extended
          - type: full
            target: full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/jovykit-${{ matrix.type }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=pr

      - name: Build and publish ${{ matrix.type }}
        uses: docker/build-push-action@v7
        with:
          context: ./image
          file: ./image/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.type }}
          cache-to: type=gha,mode=max,scope=${{ matrix.type }}

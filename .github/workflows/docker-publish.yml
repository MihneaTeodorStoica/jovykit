name: Publish Docker Images

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 0 * * 0"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule || 'default' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: mihneateodorstoica

jobs:
  build:
    name: Build ${{ matrix.type }} image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - type: minimal
            target: minimal
          - type: base
            target: base
          - type: extended
            target: extended
          - type: full
            target: full

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Select image tag
        id: image-tag
        shell: bash
        run: |
          tag=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="latest"
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 0 * * *" ]]; then
            tag="nightly"
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 0 * * 0" ]]; then
            tag="lts"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            tag="pr-${{ github.event.pull_request.number }}"
          else
            tag="latest"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Set build date
        id: date
        shell: bash
        run: echo "value=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.type }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: ./image
          file: ./image/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/labkit-${{ matrix.type }}:${{ steps.image-tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.date.outputs.value }}
            org.opencontainers.image.title=labkit ${{ matrix.type }}
          cache-from: type=gha,scope=${{ matrix.type }}
          cache-to: type=gha,mode=max,scope=${{ matrix.type }}

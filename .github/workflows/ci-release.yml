name: CI / Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  codeql:
    name: Security / CodeQL Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:python"

  semgrep:
    name: Security / Semgrep Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --error \
            --metrics=off \
            --sarif-output semgrep.sarif \
            .

      - name: Upload Semgrep SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: semgrep.sarif

  zizmor:
    name: Security / Zizmor Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install zizmor
        run: python -m pip install --disable-pip-version-check zizmor

      - name: Audit workflows
        run: |
          zizmor \
            --format sarif \
            --min-severity medium \
            --min-confidence high \
            .github > zizmor.sarif

      - name: Upload zizmor SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: zizmor.sarif

  dependency-review:
    name: Security / Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate

      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "Dependency review only runs on pull_request events."

  security:
    name: Security gate
    if: always()
    needs: [codeql, semgrep, zizmor, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check security results
        run: |
          codeql="${{ needs.codeql.result }}"
          semgrep="${{ needs.semgrep.result }}"
          zizmor="${{ needs.zizmor.result }}"
          dependency_review="${{ needs.dependency-review.result }}"

          for result in "$codeql" "$semgrep" "$zizmor"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required security job finished with result: $result"
              exit 1
            fi
          done

          if [ "$dependency_review" != "success" ] && [ "$dependency_review" != "skipped" ]; then
            echo "::error::Dependency review finished with result: $dependency_review"
            exit 1
          fi

  python:
    name: Code / Python ${{ matrix.python-version }}
    needs: security
    if: always() && needs.security.result == 'success' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-cov pytest-mock hypothesis pytest-xdist
          python -m pip install -e .

      - name: Test
        run: pytest --cov=jovykit --cov-report=term-missing --cov-fail-under=70

  analysis:
    name: Code / Analysis
    needs: security
    if: always() && needs.security.result == 'success' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-cov pytest-mock hypothesis pytest-xdist
          python -m pip install -e .
          python -m pip install black ruff mypy types-PyYAML types-requests types-tqdm build

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: black --check .

      - name: Type-check
        run: mypy jovykit tests main.py

      - name: Build package
        run: python -m build

  dependency-audit:
    name: Code / Dependency audit
    needs: security
    if: always() && needs.security.result == 'success' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            image/requirements.txt
            image/requirements-base.txt
            image/requirements-minimal.txt
            image/requirements-extended.txt
            image/requirements-full.txt

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit package dependency manifest
        run: |
          pip-audit .

      - name: Audit Python dependency manifests
        run: |
          manifest_paths=(
            requirements.txt
            requirements-dev.txt
            image/requirements.txt
            image/requirements-base.txt
            image/requirements-minimal.txt
            image/requirements-extended.txt
            image/requirements-full.txt
          )
          for req in "${manifest_paths[@]}"; do
            echo "::group::pip-audit ${req}"
            pip-audit --ignore-vuln CVE-2025-69872 --ignore-vuln PYSEC-2026-161 -r "${req}"
            echo "::endgroup::"
          done

  tag:
    name: Release / Create tag
    needs: [python, analysis, dependency-audit]
    if: always() && needs.python.result == 'success' && needs.analysis.result == 'success' && needs.dependency-audit.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
      publish: ${{ steps.tag.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Read project version
        id: version
        run: |
          version="$(python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"Expected project.version to be X.Y.Z, got {version!r}")
          print(version)
          PY
          )"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"

      - name: Check tag
        id: tag
        run: |
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}"; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists; skipping release publish."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "Manual run will publish the existing ${{ steps.version.outputs.tag }} tag."
            fi
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.tag.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

  package:
    name: Release / Build package from tag
    needs: tag
    if: always() && needs.tag.result == 'success' && needs.tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt
          python -m build
          python -m twine check dist/*

      - name: Attest package artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Release / Publish to PyPI
    needs: [tag, package]
    if: always() && needs.tag.result == 'success' && needs.package.result == 'success' && needs.tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/jovykit
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          skip-existing: true

  github-release:
    name: Release / GitHub release
    needs: [tag, package, publish]
    if: always() && needs.tag.result == 'success' && needs.package.result == 'success' && needs.publish.result == 'success' && needs.tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist

      - name: Extract changelog notes
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text()
          match = re.search(
              rf"^##\s+{re.escape(version)}(?:\s+-[^\n]*)?\n(?P<body>.*?)(?=^##\s+|\Z)",
              changelog,
              flags=re.M | re.S,
          )
          if not match:
              raise SystemExit(f"Missing CHANGELOG.md section for {version}")
          body = match.group("body").strip()
          if not body:
              raise SystemExit(f"Empty CHANGELOG.md section for {version}")
          Path("release-notes.md").write_text(body + "\n")
          PY
        env:
          VERSION: ${{ needs.tag.outputs.version }}

      - name: Create or update GitHub release
        run: |
          tag="${{ needs.tag.outputs.tag }}"
          title="${tag}"
          if immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq ".immutable // false" 2>/dev/null)"; then
            if [ "$immutable" = "true" ]; then
              echo "Release ${tag} is immutable; skipping update and asset upload."
              exit 0
            fi
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
          else
            gh release create "$tag" --verify-tag --title "$title" --notes-file release-notes.md
          fi
          gh release upload "$tag" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

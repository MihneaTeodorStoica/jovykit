name: Automation / PR Labels

# Security note: this workflow intentionally runs under `pull_request_target` to label
# safely from base-repo context. Never checkout or execute PR head code here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Label changed files
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          pr-number: ${{ github.event.pull_request.number }}
          sync-labels: true
          dot: true

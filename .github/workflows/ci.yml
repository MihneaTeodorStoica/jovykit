name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint Python files
        run: ruff check .

      - name: Check formatting
        run: black --check .

      - name: Type-check Python files
        run: |
          if find . -path ./.git -prune -o -name '*.py' -print -quit | grep -q .; then
            mypy .
          else
            echo "No Python files to type-check yet."
          fi

      - name: Run tests when present
        run: |
          if [ -d tests ] || find . -path ./.git -prune -o -name 'test_*.py' -print -quit | grep -q .; then
            pytest --cov=. --cov-report=term-missing
          else
            echo "No tests found yet."
          fi

      - name: Audit project dependencies
        run: pip-audit -r requirements.txt

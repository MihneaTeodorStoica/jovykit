name: Community Automation

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  models: read
  pull-requests: write

jobs:
  greeting:
    name: First interaction greeting
    if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: Thanks for opening your first issue here. A maintainer will take a look soon.
          pr-message: Thanks for opening your first pull request here. The CI checks will help us review it cleanly.

  labeler:
    name: Pull request labeler
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels
        uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  issue-summary:
    name: AI issue summary
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Create prompt
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("fs");
            const issue = context.payload.issue;
            const prompt = [
              "Summarize this GitHub issue for maintainers.",
              "Focus on the user's request, concrete repro details, risks, and the likely next action.",
              "Keep the answer under 180 words and avoid inventing facts.",
              "",
              `Title: ${issue.title}`,
              "",
              "Body:",
              issue.body || "(No body provided.)",
            ].join("\n");
            fs.writeFileSync("issue-summary.prompt.md", prompt);

      - name: Generate summary
        id: summary
        uses: actions/ai-inference@e09e65981758de8b2fdab13c2bfb7c7d5493b0b6 # v2
        with:
          model: openai/gpt-4o
          max-tokens: 500
          temperature: 0.2
          prompt-file: issue-summary.prompt.md

      - name: Comment with summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RESPONSE_FILE: ${{ steps.summary.outputs.response-file }}
        with:
          script: |
            const fs = require("fs");
            const summary = fs.readFileSync(process.env.RESPONSE_FILE, "utf8").trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `### AI issue summary\n\n${summary || "No summary was generated."}`,
            });

  stale:
    name: Mark stale issues and pull requests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale items
        uses: actions/stale@b5d41d4e1d5dceea10e7104786b73624c18a190f # v10
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,help wanted
          exempt-pr-labels: pinned,security,work-in-progress
          stale-issue-message: This issue has been quiet for 60 days and is now marked stale. It will close in 14 days unless there is new activity.
          stale-pr-message: This pull request has been quiet for 60 days and is now marked stale. It will close in 14 days unless there is new activity.
          close-issue-message: Closing this stale issue. Reopen it if it is still relevant.
          close-pr-message: Closing this stale pull request. Reopen it if it is still relevant.

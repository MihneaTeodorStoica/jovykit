automation:
  - changed-files:
      - any-glob-to-any-file:
          - .github/actions/**
          - .github/dependabot.yml
          - .github/labeler.yml
          - .github/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/actions/**
          - .github/workflows/**

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/actions/**
          - .github/workflows/**

cli:
  - changed-files:
      - any-glob-to-any-file:
          - jovykit/cli.py
          - jovykit/commands.py
          - jovykit/docker_install.py
          - jovykit/runtime.py
          - jovykit/templates.py
          - main.py

config:
  - changed-files:
      - any-glob-to-any-file:
          - jovykit/config.py
          - jovykit/images.py
          - jovykit/paths.py
          - jovykit/templates.py
          - pyproject.toml

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - .github/dependabot.yml
          - requirements*.txt
          - image/requirements*.txt
          - uv.lock
          - pyproject.toml

docker:
  - changed-files:
      - any-glob-to-any-file:
          - image/**
          - build.sh
          - Dockerfile
          - "**/Dockerfile"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - site/**
          - wiki/**
          - .github/ISSUE_TEMPLATE/**
          - .github/PULL_REQUEST_TEMPLATE.md
          - "*.md"

governance:
  - changed-files:
      - any-glob-to-any-file:
          - CODE_OF_CONDUCT.md
          - CONTRIBUTING.md
          - GOVERNANCE.md
          - SECURITY.md
          - SUPPORT.md
          - .github/ISSUE_TEMPLATE/**
          - .github/PULL_REQUEST_TEMPLATE.md

python:
  - changed-files:
      - any-glob-to-any-file:
          - jovykit/**
          - tests/**
          - main.py
          - pyproject.toml

security:
  - changed-files:
      - any-glob-to-any-file:
          - .github/dependabot.yml
          - .github/workflows/pr-labels.yml
          - .github/workflows/ci-release.yml
          - .github/workflows/images.yml
          - SECURITY.md

tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**

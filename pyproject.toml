[project]
name = "labkit"
version = "0.1.0"
description = "Layered Jupyter container images and project-local LabKit environments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "rich",
    "typer",
]

[project.scripts]
lab = "labkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["labkit*"]

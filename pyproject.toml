[project]
name = "jovykit"
version = "5.3.0"
description = "Layered Jupyter container images and project-local JovyKit environments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "rich",
    "textual",
    "tomlkit",
    "typer",
]

[project.urls]
Homepage = "https://mihneateodorstoica.github.io/jovykit/"
Repository = "https://github.com/MihneaTeodorStoica/jovykit"
Issues = "https://github.com/MihneaTeodorStoica/jovykit/issues"
Changelog = "https://github.com/MihneaTeodorStoica/jovykit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/MihneaTeodorStoica/jovykit/wiki"

[project.scripts]
jovy = "jovykit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jovykit*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "unit: fast isolated unit tests",
    "integration: multi-module integration tests",
    "docker: optional tests requiring Docker",
    "slow: slower tests skipped in tight loops",
]

[tool.coverage.run]
branch = true
source = ["jovykit"]
omit = [
    "jovykit/tui.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.black]
target-version = ["py311"]

[project]
name = "jovykit"
version = "1.1.1"
description = "Layered Jupyter container images and project-local JovyKit environments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "rich",
    "typer",
]

[project.urls]
Homepage = "https://github.com/MihneaTeodorStoica/jovykit"
Repository = "https://github.com/MihneaTeodorStoica/jovykit"
Issues = "https://github.com/MihneaTeodorStoica/jovykit/issues"
Changelog = "https://github.com/MihneaTeodorStoica/jovykit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/MihneaTeodorStoica/jovykit/tree/main/docs"

[project.scripts]
jovy = "jovykit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jovykit*"]

[tool.pytest.ini_options]
pythonpath = ["."]
